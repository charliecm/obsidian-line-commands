name: Release Obsidian plugin

on:
    push:
        tags:
            - "*"

permissions:
    contents: write
    id-token: write
    attestations: write

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v6

            - name: Use Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: "24"

            - name: Build plugin
              run: |
                  npm ci
                  npm run build

            - name: Check for styles.css
              id: styles
              run: echo "exists=$([ -f styles.css ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

            - name: Attest build provenance
              uses: actions/attest@v4
              with:
                  subject-path: ${{ steps.styles.outputs.exists == 'true' && 'main.js, styles.css' || 'main.js' }}

            - name: Create release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  tag="${GITHUB_REF#refs/tags/}"
                  assets="main.js manifest.json"
                  if [[ "${{ steps.styles.outputs.exists }}" == "true" ]]; then
                    assets="$assets styles.css"
                  fi

                  # A tag with a SemVer pre-release suffix (e.g. 1.4.0-beta.1) is a
                  # beta for BRAT testers: mark it as a pre-release and use the
                  # "Unreleased" changelog section, since betas have no heading.
                  if [[ "$tag" == *-* ]]; then
                    heading="## Unreleased"
                    prerelease="--prerelease"
                  else
                    heading="## $tag ("
                    prerelease=""
                  fi

                  notes="$(awk -v heading="$heading" '
                    index($0, heading) == 1 { found=1; next }
                    found && /^## / { exit }
                    found { print }
                    END { if (!found) exit 1 }
                  ' CHANGELOG.md)"

                  release_url="$(gh release create "$tag" \
                    --title="$tag" \
                    --draft \
                    $prerelease \
                    --notes="$notes" \
                    $assets)"

                  {
                    echo "## Draft release ready"
                    echo
                    echo "Publish [$tag]($release_url)."
                  } >> "$GITHUB_STEP_SUMMARY"
